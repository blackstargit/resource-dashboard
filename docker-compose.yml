services:
  resource-dashboard:
    build: .
    restart: unless-stopped
    pid: host
    ports:
      - "${PORT:-8212}:${PORT:-8212}"
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-8212}
      DISK_PATH: /host
      DB_PATH: /data/dashboard.db
      # Set these in .env — the user is seeded on startup.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Off by default -- this is the one destructive action the app exposes.
      ALLOW_PROCESS_KILL: ${ALLOW_PROCESS_KILL:-false}
      # Passed through so .env actually controls them; defaults match config.py.
      PBKDF2_ITERATIONS: ${PBKDF2_ITERATIONS:-300000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SIGNATURE_WINDOW_SECONDS: ${SIGNATURE_WINDOW_SECONDS:-120}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
    volumes:
      - /:/host:ro
      # Persists the user and active sessions across restarts.
      - dashboard-data:/data

volumes:
  dashboard-data:
